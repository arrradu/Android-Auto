name: Build APK

on:
  push:
  workflow_dispatch:

# Publishing the APK as a release needs write access to the repository contents.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AA Lynk APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # NDK and CMake versions are pinned in app/build.gradle.kts. Retried because sdkmanager
      # downloads occasionally arrive corrupt on GitHub-hosted runners.
      - name: Install pinned NDK and CMake
        run: |
          for attempt in 1 2 3; do
            sdkmanager "ndk;29.0.14206865" "cmake;3.22.1" && exit 0
            echo "sdkmanager attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleGithubDebug --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/github/debug/*.apk "out/AA-Lynk-${{ github.run_number }}.apk"
          ls -la out

      - name: Upload APK to the run
        uses: actions/upload-artifact@v4
        with:
          name: AA-Lynk-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

      # A release gives a direct download link that opens from a phone browser.
      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AA Lynk build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          body: Built from commit ${{ github.sha }}.
